name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch when new commits arrive.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mypy:
    name: mypy (type check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # requirements-dev.txt pulls in requirements.txt via `-r`, so the
        # type checker runs against the same runtime versions users get.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Type-check
        run: mypy --config-file mypy.ini

  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # Single source of truth for dev/CI packages. Previously the test
        # packages were named inline here and pytest-asyncio was simply
        # forgotten — the async MCP-server tests passed on developer
        # machines and failed in CI for exactly that reason.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          # Run the whole suite rather than a hand-maintained file list. The
          # previous list had silently drifted: 14 files were never run here,
          # including every merkle / STH / transparency test — the modules
          # behind the audit-integrity claim. A new test file is now gated the
          # moment it lands, instead of when someone remembers to add it.
          pytest tests/ \
            --cov=haldir_gate \
            --cov=haldir_vault \
            --cov=haldir_watch \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage to Codecov
        # Only upload once per CI run (from the lowest Python in the matrix)
        # to avoid hammering codecov with N parallel uploads of the same data.
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          flags: python
          name: haldir-${{ matrix.python-version }}
          # CODECOV_TOKEN is optional for public repos but recommended.
          # Set in repo Settings → Secrets → Actions if you have one.
          token: ${{ secrets.CODECOV_TOKEN }}

  postgres:
    name: pytest (Postgres)
    runs-on: ubuntu-latest

    # The Postgres path had never run anywhere. DATABASE_URL is the documented
    # production configuration — README, SELF_HOSTING.md and docker-compose all
    # point at it, and the container ships postgres:16 — but every test and
    # every CI run exercised SQLite only. A hand-rolled translation layer
    # (_sqlite_to_pg in haldir_db.py) rewrites the SQL and a wrapper class
    # emulates the sqlite3 connection API over psycopg2, and none of it was
    # covered. For a product sold on the integrity of what it stores, "the
    # database we tell enterprises to run is untested" is the wrong answer.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: haldir
          POSTGRES_PASSWORD: haldir
          POSTGRES_DB: haldir
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests against Postgres
        env:
          DATABASE_URL: postgresql://haldir:haldir@localhost:5432/haldir
          # Fixed key so the run is reproducible; the app otherwise
          # generates a throwaway one and warns.
          HALDIR_ENCRYPTION_KEY: "BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc="
        run: |
          # API-level suites only. The unit tests (test_db, test_migrate, …)
          # build their own temp SQLite files and pass the path in, so with
          # DATABASE_URL set they assert against a file the app is no longer
          # using — they would measure the harness, not Postgres. These go
          # through the app's own connection layer, which is the path a
          # deployment actually takes.
          pytest tests/test_api.py \
                 tests/test_admin.py \
                 tests/test_delegation.py \
                 tests/test_sth_log.py \
                 -q --tb=short

  package:
    name: package (build the wheel and actually run it)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every other job runs against the source tree, where `import cli` simply
    # works because cli.py is sitting right there. That is why two separate
    # breakages reached PyPI while CI stayed green:
    #
    #   * the wheel shipped no cli.py, haldir_db.py or haldir_mcp_server.py,
    #     so `pip install haldir && haldir overview` — the first line of the
    #     README — died on ModuleNotFoundError. Nobody who ever installed
    #     from PyPI could start it.
    #   * pyproject.toml declared `mcp>=1.27.0` with no upper bound while
    #     requirements.txt bounded it below 2.0, so PyPI users resolved mcp
    #     2.x and the MCP server died on `'Server' object has no attribute
    #     'list_tools'`.
    #
    # Both were invisible from inside the checkout and obvious from outside
    # it. This job is the outside.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build the wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          # `python -m build` is not clean, and stale state there is
          # indistinguishable from a fresh build. Both `dist/` and
          # `*.egg-info/` change what gets packaged: with an old egg-info in
          # place hatchling reuses its file selection, so a wheel built from a
          # correct pyproject still shipped only three modules. That is why
          # this job failed twice on the same symptom after two different
          # fixes to the include list — the list was never the problem here.
          rm -rf build dist *.egg-info
          python -m build

      - name: Install the wheel into a clean environment
        # Not `pip install -e .`, and the next steps run from /tmp, so nothing
        # can be satisfied by the source tree. This is what a user gets.
        run: |
          python -m venv /tmp/pkg-venv
          /tmp/pkg-venv/bin/pip install --upgrade pip
          /tmp/pkg-venv/bin/pip install dist/*.whl

      - name: The console scripts must start
        working-directory: /tmp
        run: |
          set -euo pipefail

          # Proves the script resolves its module and that the dependency
          # graph is complete enough to import.
          /tmp/pkg-venv/bin/haldir --help > /dev/null
          echo "haldir --help: ok"

          # haldir-mcp speaks stdio and exits when stdin closes. What matters
          # is that it builds the server rather than dying on an import, so a
          # traceback naming our own modules or a missing attribute fails and
          # a clean exit does not.
          set +e
          /tmp/pkg-venv/bin/haldir-mcp < /dev/null 2>/tmp/mcp.err
          set -e
          if grep -qE "ModuleNotFoundError|ImportError|AttributeError" /tmp/mcp.err; then
            echo "::error::haldir-mcp could not start"
            sed -n '1,40p' /tmp/mcp.err
            exit 1
          fi
          echo "haldir-mcp: started without an import error"

      - name: Every shipped module must import
        working-directory: /tmp
        run: |
          # Catches a module that is included in the wheel but whose
          # dependencies are not declared — `api.py` imports flask at module
          # level, and flask was missing from pyproject.toml entirely.
          /tmp/pkg-venv/bin/python - <<'PY'
          import importlib
          import pkgutil
          import site
          import sys

          failures = []
          for root in site.getsitepackages():
              for mod in sorted(pkgutil.iter_modules([root])):
                  name = mod.name
                  if not (name.startswith("haldir") or name in ("cli", "api")):
                      continue
                  try:
                      importlib.import_module(name)
                  except Exception as e:
                      failures.append(f"{name}: {type(e).__name__}: {e}")

          if failures:
              print("::error::shipped modules that cannot be imported:")
              for f in failures:
                  print("   ", f)
              sys.exit(1)
          print("all shipped modules import")
          PY
