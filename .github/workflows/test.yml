name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch when new commits arrive.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mypy:
    name: mypy (type check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # requirements-dev.txt pulls in requirements.txt via `-r`, so the
        # type checker runs against the same runtime versions users get.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Type-check
        run: mypy --config-file mypy.ini

  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # Single source of truth for dev/CI packages. Previously the test
        # packages were named inline here and pytest-asyncio was simply
        # forgotten — the async MCP-server tests passed on developer
        # machines and failed in CI for exactly that reason.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          # Run the whole suite rather than a hand-maintained file list. The
          # previous list had silently drifted: 14 files were never run here,
          # including every merkle / STH / transparency test — the modules
          # behind the audit-integrity claim. A new test file is now gated the
          # moment it lands, instead of when someone remembers to add it.
          pytest tests/ \
            --cov=haldir_gate \
            --cov=haldir_vault \
            --cov=haldir_watch \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=78 \
            -v

      - name: Upload coverage to Codecov
        # Only upload once per CI run (from the lowest Python in the matrix)
        # to avoid hammering codecov with N parallel uploads of the same data.
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          flags: python
          name: haldir-${{ matrix.python-version }}
          # CODECOV_TOKEN is optional for public repos but recommended.
          # Set in repo Settings → Secrets → Actions if you have one.
          token: ${{ secrets.CODECOV_TOKEN }}

  postgres:
    name: pytest (Postgres)
    runs-on: ubuntu-latest

    # Bounded so a hang fails the job instead of being cancelled by whatever
    # push comes next. This job spent fifteen minutes at a time producing no
    # pytest output at all, and being cancelled at the end of it meant the
    # log never contained a verdict. A red check with a readable failure is
    # worth more than a grey one with nothing in it.
    timeout-minutes: 6

    # The Postgres path had never run anywhere. DATABASE_URL is the documented
    # production configuration — README, SELF_HOSTING.md and docker-compose all
    # point at it, and the container ships postgres:16 — but every test and
    # every CI run exercised SQLite only. A hand-rolled translation layer
    # (_sqlite_to_pg in haldir_db.py) rewrites the SQL and a wrapper class
    # emulates the sqlite3 connection API over psycopg2, and none of it was
    # covered. For a product sold on the integrity of what it stores, "the
    # database we tell enterprises to run is untested" is the wrong answer.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: haldir
          POSTGRES_PASSWORD: haldir
          POSTGRES_DB: haldir
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests against Postgres
        env:
          DATABASE_URL: postgresql://haldir:haldir@localhost:5432/haldir
          # Fixed key so the run is reproducible; the app otherwise
          # generates a throwaway one and warns.
          HALDIR_ENCRYPTION_KEY: "BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc="
          # Fail a lock wait in two seconds rather than ten. The point is not
          # the value: it is that a cascade of lock timeouts shows up as a
          # short, readable failure instead of a fifteen-minute silence.
          HALDIR_PG_LOCK_TIMEOUT_MS: "2000"
        run: |
          # API-level suites only. The unit tests (test_db, test_migrate, …)
          # build their own temp SQLite files and pass the path in, so with
          # DATABASE_URL set they assert against a file the app is no longer
          # using — they would measure the harness, not Postgres. These go
          # through the app's own connection layer, which is the path a
          # deployment actually takes.
          pytest tests/test_api.py \
                 tests/test_admin.py \
                 tests/test_delegation.py \
                 tests/test_sth_log.py \
                 tests/test_retention.py \
                 tests/test_concurrency.py \
                 tests/test_invariants_chain.py \
                 tests/test_invariants_spend.py \
                 tests/test_invariants_secrets.py \
                 -q --tb=short -x \
                 --timeout=120 --timeout-method=thread

      - name: Who is holding the locks?
        # The diagnostic that was missing. This job's failure mode was
        # `CREATE INDEX IF NOT EXISTS idx_audit_*` being cancelled by
        # lock_timeout, over and over, for fifteen minutes — which says a
        # conflicting lock is held but not by whom. CREATE INDEX takes SHARE,
        # and SHARE conflicts with ROW EXCLUSIVE, which is what any open
        # write transaction holds; so the question is which connection is
        # sitting in a transaction, and on what.
        #
        # Answered from the server rather than guessed at from the client.
        # Runs only on failure so it costs nothing when the job is green.
        if: failure()
        env:
          PGPASSWORD: haldir
        run: |
          echo "=== pg_stat_activity: who is connected and what are they doing ==="
          psql -h localhost -U haldir -d haldir -x -c "
            SELECT pid, state, wait_event_type, wait_event,
                   now() - xact_start AS xact_age,
                   left(coalesce(query, ''), 120) AS query
            FROM pg_stat_activity
            WHERE datname = 'haldir' AND pid <> pg_backend_pid()
            ORDER BY xact_start NULLS LAST;"
          echo
          echo "=== pg_locks: who holds what, and who is waiting ==="
          psql -h localhost -U haldir -d haldir -c "
            SELECT l.pid, l.locktype, l.mode, l.granted,
                   c.relname, a.state,
                   now() - a.xact_start AS xact_age
            FROM pg_locks l
            LEFT JOIN pg_class c ON c.oid = l.relation
            LEFT JOIN pg_stat_activity a ON a.pid = l.pid
            WHERE c.relname IN ('audit_log','sessions','api_keys')
            ORDER BY l.granted, c.relname;"
          echo
          echo "=== idle-in-transaction is the suspect ==="
          psql -h localhost -U haldir -d haldir -c "
            SELECT count(*) AS idle_in_transaction
            FROM pg_stat_activity
            WHERE state = 'idle in transaction';"
          echo
          echo "=== the constraint the audit chain's integrity rests on ==="
          # Two writers cannot claim the same (tenant_id, seq) without this
          # index, so a forked chain on Postgres and not on SQLite is most
          # likely this constraint being absent rather than the appends being
          # wrong. Reported directly so the next failure says which.
          psql -h localhost -U haldir -d haldir -c "
            SELECT indexname, indexdef FROM pg_indexes
            WHERE tablename = 'audit_log';"
          echo
          echo "=== duplicate sequence numbers, if any ==="
          psql -h localhost -U haldir -d haldir -c "
            SELECT tenant_id, seq, count(*) FROM audit_log
            WHERE seq > 0 GROUP BY tenant_id, seq HAVING count(*) > 1
            LIMIT 20;"
          echo
          echo "=== entries claiming to start the chain ==="
          psql -h localhost -U haldir -d haldir -c "
            SELECT tenant_id, count(*) AS chain_roots FROM audit_log
            WHERE prev_hash = '' GROUP BY tenant_id;"

  package:
    name: package (build the wheel and actually run it)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every other job runs against the source tree, where `import cli` simply
    # works because cli.py is sitting right there. That is why two separate
    # breakages reached PyPI while CI stayed green:
    #
    #   * the wheel shipped no cli.py, haldir_db.py or haldir_mcp_server.py,
    #     so `pip install haldir && haldir overview` — the first line of the
    #     README — died on ModuleNotFoundError. Nobody who ever installed
    #     from PyPI could start it.
    #   * pyproject.toml declared `mcp>=1.27.0` with no upper bound while
    #     requirements.txt bounded it below 2.0, so PyPI users resolved mcp
    #     2.x and the MCP server died on `'Server' object has no attribute
    #     'list_tools'`.
    #
    # Both were invisible from inside the checkout and obvious from outside
    # it. This job is the outside.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build the wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          # `python -m build` is not clean, and stale state there is
          # indistinguishable from a fresh build. Both `dist/` and
          # `*.egg-info/` change what gets packaged: with an old egg-info in
          # place hatchling reuses its file selection, so a wheel built from a
          # correct pyproject still shipped only three modules. That is why
          # this job failed twice on the same symptom after two different
          # fixes to the include list — the list was never the problem here.
          rm -rf build dist *.egg-info
          python -m build

      - name: Install the wheel into a clean environment
        # Not `pip install -e .`, and the next steps run from /tmp, so nothing
        # can be satisfied by the source tree. This is what a user gets.
        run: |
          python -m venv /tmp/pkg-venv
          /tmp/pkg-venv/bin/pip install --upgrade pip
          /tmp/pkg-venv/bin/pip install dist/*.whl

      - name: The console scripts must start
        working-directory: /tmp
        run: |
          set -euo pipefail

          # Proves the script resolves its module and that the dependency
          # graph is complete enough to import.
          /tmp/pkg-venv/bin/haldir --help > /dev/null
          echo "haldir --help: ok"

          # haldir-mcp speaks stdio and exits when stdin closes. What matters
          # is that it builds the server rather than dying on an import, so a
          # traceback naming our own modules or a missing attribute fails and
          # a clean exit does not.
          set +e
          /tmp/pkg-venv/bin/haldir-mcp < /dev/null 2>/tmp/mcp.err
          set -e
          if grep -qE "ModuleNotFoundError|ImportError|AttributeError" /tmp/mcp.err; then
            echo "::error::haldir-mcp could not start"
            sed -n '1,40p' /tmp/mcp.err
            exit 1
          fi
          echo "haldir-mcp: started without an import error"

      - name: Every shipped module must import
        working-directory: /tmp
        run: |
          # Catches a module that is included in the wheel but whose
          # dependencies are not declared — `api.py` imports flask at module
          # level, and flask was missing from pyproject.toml entirely.
          /tmp/pkg-venv/bin/python - <<'PY'
          import importlib
          import pkgutil
          import site
          import sys

          failures = []
          for root in site.getsitepackages():
              for mod in sorted(pkgutil.iter_modules([root])):
                  name = mod.name
                  if not (name.startswith("haldir") or name in ("cli", "api")):
                      continue
                  try:
                      importlib.import_module(name)
                  except Exception as e:
                      failures.append(f"{name}: {type(e).__name__}: {e}")

          if failures:
              print("::error::shipped modules that cannot be imported:")
              for f in failures:
                  print("   ", f)
              sys.exit(1)
          print("all shipped modules import")
          PY

  security:
    name: security (deps + static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit>=2.7,<3" "bandit>=1.7,<2"

      - name: Audit dependencies for known CVEs
        # Haldir is a security product that moves money and holds secrets; a
        # CVE in a pinned dependency is a CVE in Haldir. The pins are bounded
        # but frozen, so this is the only thing that will notice when one of
        # them is disclosed. Fails the build: a known-vulnerable dependency
        # shipping to users is worse than a red check.
        run: pip-audit -r requirements.txt --strict --desc

      - name: Static analysis
        # Deliberately narrow. A blanket `bandit -r .` on this codebase
        # reports things that are the product rather than defects: it fires
        # on `subprocess` in the reverse-shell teaching examples, on the
        # intentionally-weak hashing in the crypto demos, and on every
        # `try/except/pass` in the SQLite migration path. A check that is
        # always red is a check nobody reads, so this runs at medium
        # severity over the modules that actually enforce something.
        run: |
          bandit -ll -r haldir_gate haldir_vault haldir_watch \
                 --exclude '*/tests/*' \
                 -f screen

  coverage-floor:
    name: coverage floor is not lowered
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: The floor in the workflow may not go down
        # A ratchet only ratchets if something stops it being loosened. The
        # cheapest way to fix a failing coverage gate is to lower the number,
        # and that is exactly the move this forbids.
        run: |
          set -euo pipefail

          # Make the base ref resolvable before depending on it. With
          # `set -e`, a failing command substitution aborts the step
          # immediately and prints nothing at all — which is how this check
          # came to fail with an empty log and no explanation: `origin/main`
          # was not a ref in the checkout, so `git merge-base` exited 1 and
          # took the step with it before a single line was echoed.
          #
          # A check whose failure mode is silence is worse than no check, so
          # the fetch is explicit and its failure is reported.
          if ! git rev-parse --verify --quiet "origin/${{ github.base_ref }}" >/dev/null; then
            echo "origin/${{ github.base_ref }} not present; fetching it"
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          fi

          base="$(git merge-base HEAD origin/${{ github.base_ref }})" || {
            echo "::error::could not find a merge base against origin/${{ github.base_ref }}"
            exit 1
          }
          old=$(git show "$base:.github/workflows/test.yml" \
                | grep -oE '\-\-cov-fail-under=[0-9]+' | head -1 | cut -d= -f2)
          new=$(grep -oE '\-\-cov-fail-under=[0-9]+' .github/workflows/test.yml | head -1 | cut -d= -f2)
          echo "base floor=${old:-none}  this branch floor=${new:-none}"
          if [ -z "$new" ]; then
            echo "::error::--cov-fail-under was removed from the pytest step"
            exit 1
          fi
          if [ -n "$old" ] && [ "$new" -lt "$old" ]; then
            echo "::error::coverage floor lowered from $old to $new"
            exit 1
          fi
