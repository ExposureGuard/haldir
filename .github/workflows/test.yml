name: tests

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main. Restricting this to
  # `main` meant a stacked PR — one branched off another feature branch
  # rather than off main — ran no checks at all, which is the moment you
  # most want them. Pushes are still limited to main so a feature branch
  # does not re-run CI on every commit.
  pull_request:

# Cancel in-flight runs for the same branch when new commits arrive.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mypy:
    name: mypy (type check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # requirements-dev.txt pulls in requirements.txt via `-r`, so the
        # type checker runs against the same runtime versions users get.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Type-check
        run: mypy --config-file mypy.ini

  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # Single source of truth for dev/CI packages. Previously the test
        # packages were named inline here and pytest-asyncio was simply
        # forgotten — the async MCP-server tests passed on developer
        # machines and failed in CI for exactly that reason.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          # Run the whole suite rather than a hand-maintained file list. The
          # previous list had silently drifted: 14 files were never run here,
          # including every merkle / STH / transparency test — the modules
          # behind the audit-integrity claim. A new test file is now gated the
          # moment it lands, instead of when someone remembers to add it.
          # --cov-fail-under is a ratchet, not a target: coverage was being
          # measured and uploaded but never enforced, so it could fall
          # silently forever. Set just below the current figure so the only
          # direction it can move is up. Raise it when you raise coverage.
          pytest tests/ \
            --cov=haldir_gate \
            --cov=haldir_vault \
            --cov=haldir_watch \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=78 \
            -v

      - name: Upload coverage to Codecov
        # Only upload once per CI run (from the lowest Python in the matrix)
        # to avoid hammering codecov with N parallel uploads of the same data.
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          flags: python
          name: haldir-${{ matrix.python-version }}
          # CODECOV_TOKEN is optional for public repos but recommended.
          # Set in repo Settings → Secrets → Actions if you have one.
          token: ${{ secrets.CODECOV_TOKEN }}

  postgres:
    name: pytest (Postgres)
    runs-on: ubuntu-latest

    # The Postgres path had never run anywhere. DATABASE_URL is the documented
    # production configuration — README, SELF_HOSTING.md and docker-compose all
    # point at it, and the container ships postgres:16 — but every test and
    # every CI run exercised SQLite only. A hand-rolled translation layer
    # (_sqlite_to_pg in haldir_db.py) rewrites the SQL and a wrapper class
    # emulates the sqlite3 connection API over psycopg2, and none of it was
    # covered. For a product sold on the integrity of what it stores, "the
    # database we tell enterprises to run is untested" is the wrong answer.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: haldir
          POSTGRES_PASSWORD: haldir
          POSTGRES_DB: haldir
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests against Postgres
        env:
          DATABASE_URL: postgresql://haldir:haldir@localhost:5432/haldir
          # Fixed key so the run is reproducible; the app otherwise
          # generates a throwaway one and warns.
          HALDIR_ENCRYPTION_KEY: "BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc="
        run: |
          # API-level suites only. The unit tests (test_db, test_migrate, …)
          # build their own temp SQLite files and pass the path in, so with
          # DATABASE_URL set they assert against a file the app is no longer
          # using — they would measure the harness, not Postgres. These go
          # through the app's own connection layer, which is the path a
          # deployment actually takes.
          # The three invariant suites are here because the guarantees they
          # assert are enforced *by the database*: the spend cap is a
          # conditional UPDATE, the chain guard a partial unique index, and
          # the secret binding rides on the engine's AES-GCM implementation.
          # SQLite and Postgres agree on all three, but "they agree" is a
          # claim worth testing rather than assuming. Postgres also stores
          # NaN and infinity where SQLite rejects them, so the fuzz cases in
          # test_invariants_chain only run in full here.
          #
          # test_concurrency is here deliberately: the spend cap is a
          # conditional UPDATE and the chain guard is a partial unique index,
          # and both are evaluated by the *database*. SQLite and Postgres
          # agree on these two, but "they agree" is a claim worth testing
          # rather than assuming — the assertion that matters is that the cap
          # still holds and the chain still verifies when the engine doing
          # the arithmetic changes underneath.
          pytest tests/test_api.py \
                 tests/test_admin.py \
                 tests/test_delegation.py \
                 tests/test_sth_log.py \
                 tests/test_concurrency.py \
                 tests/test_retention.py \
                 tests/test_invariants_chain.py \
                 tests/test_invariants_spend.py \
                 tests/test_invariants_secrets.py \
                 -q --tb=short

  security:
    name: security (deps + static analysis)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit>=2.7,<3" "bandit>=1.7,<2"

      - name: Audit dependencies for known CVEs
        # Haldir is a security product that moves money and holds secrets; a
        # CVE in a pinned dependency is a CVE in Haldir. The pins are bounded
        # but frozen, so this is the only thing that will notice when one of
        # them is disclosed. Fails the build: a known-vulnerable dependency
        # shipping to users is worse than a red check.
        run: pip-audit -r requirements.txt --strict --desc

      - name: Static analysis
        # Deliberately narrow. A blanket `bandit -r .` on this codebase
        # reports things that are the product rather than defects: it fires
        # on `subprocess` in the reverse-shell teaching examples, on the
        # intentionally-weak hashing in the crypto demos, and on every
        # `try/except/pass` in the SQLite migration path. A check that is
        # always red is a check nobody reads, so this runs at medium
        # severity over the modules that actually enforce something.
        run: |
          bandit -ll -r haldir_gate haldir_vault haldir_watch \
                 --exclude '*/tests/*' \
                 -f screen

  coverage-floor:
    name: coverage floor is not lowered
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: The floor in the workflow may not go down
        # A ratchet only ratchets if something stops it being loosened. The
        # cheapest way to fix a failing coverage gate is to lower the number,
        # and that is exactly the move this forbids.
        run: |
          set -euo pipefail
          base="$(git merge-base HEAD origin/${{ github.base_ref }})"
          old=$(git show "$base:.github/workflows/test.yml" \
                | grep -oE '\-\-cov-fail-under=[0-9]+' | head -1 | cut -d= -f2)
          new=$(grep -oE '\-\-cov-fail-under=[0-9]+' .github/workflows/test.yml | head -1 | cut -d= -f2)
          echo "base floor=${old:-none}  this branch floor=${new:-none}"
          if [ -z "$new" ]; then
            echo "::error::--cov-fail-under was removed from the pytest step"
            exit 1
          fi
          if [ -n "$old" ] && [ "$new" -lt "$old" ]; then
            echo "::error::coverage floor lowered from $old to $new"
            exit 1
          fi
