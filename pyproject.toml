[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "haldir"
version = "0.3.0"
description = "The guardian layer for AI agents — scoped sessions, AES-256-GCM secrets, hash-chained audit, policy proxy."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sterling Ivey", email = "sterling@haldir.xyz"}]
maintainers = [{name = "Sterling Ivey", email = "sterling@haldir.xyz"}]
keywords = [
    "ai-agents", "agent-governance", "agent-security",
    "mcp", "model-context-protocol",
    "langchain", "crewai", "vercel-ai-sdk",
    "identity", "secrets-management", "audit", "audit-log",
    "hash-chain", "tamper-evident", "compliance",
    "aes-256-gcm", "proxy", "policy-enforcement", "spend-control",
    "human-in-the-loop", "governance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Logging",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
    "Typing :: Typed",
]
# These must say the same thing as requirements.txt. They did not, and it cost
# the published package twice over:
#
#   * Five runtime dependencies were missing entirely. `api.py` is shipped and
#     imports flask at module level, so `pip install haldir && python -c
#     "import api"` failed on ModuleNotFoundError: No module named 'flask'.
#
#   * `mcp>=1.27.0` had no upper bound, so PyPI users resolved mcp 2.x, whose
#     Server API rewrite removed the `@server.list_tools()` decorator this code
#     uses — the MCP server died with `'Server' object has no attribute
#     'list_tools'`. CI never saw it because CI installs requirements.txt,
#     which correctly bounds mcp below 2.0.
#
# Every bound here is copied from requirements.txt, so a self-hoster and a
# `pip install` get the same thing. tests/test_packaging.py asserts the two
# lists describe the same packages.
dependencies = [
    "flask>=3.0.0,<4.0.0",
    "flask-cors>=4.0.0,<7.0.0",
    "gunicorn>=21.2.0,<27.0.0",
    "mcp>=1.27.0,<2.0.0",
    "httpx>=0.28.1,<1.0.0",
    "pydantic>=2.13.2,<3.0.0",
    "cryptography>=46.0.7,<51.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "stripe>=8.0.0,<16.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3", "pytest-asyncio>=1.3.0"]

[project.scripts]
haldir = "cli:main"
# haldir_mcp_server, not mcp_server. There were two stdio MCP servers: this
# one registers 18 tools (including the audit-integrity set — verify_chain,
# tree heads, inclusion and consistency proofs, evidence packs) and is the
# one with tests. mcp_server.py registered 9 of them, was untested, and was
# the one both this entry point and the Smithery listing actually launched —
# so every user got the narrower, unverified surface.
haldir-mcp = "haldir_mcp_server:main"

[project.urls]
Homepage = "https://haldir.xyz"
Documentation = "https://haldir.xyz/docs"
Repository = "https://github.com/ExposureGuard/haldir"
Issues = "https://github.com/ExposureGuard/haldir/issues"
Discussions = "https://github.com/ExposureGuard/haldir/discussions"
Changelog = "https://github.com/ExposureGuard/haldir/blob/main/CHANGELOG.md"
Wiki = "https://github.com/ExposureGuard/haldir/wiki"
"Self-Hosting" = "https://github.com/ExposureGuard/haldir/blob/main/SELF_HOSTING.md"
Security = "https://github.com/ExposureGuard/haldir/blob/main/SECURITY.md"

# `include` alone, naming the packages AND the loose top-level modules.
#
# This previously set `packages = [...]` and then an `include = [...]` for the
# three modules. Hatchling's `packages` is a shorthand that *replaces*
# `include`, so those three were dropped from the wheel — and with them the
# `haldir` console script, the `haldir-mcp` entry point, and the database
# layer both import.
#
# The published 0.3.0 on PyPI has this shape. It is not a rare edge: nobody who
# has ever run `pip install haldir` has been able to start the CLI, because the
# first line of the README dies on `ModuleNotFoundError: No module named 'cli'`.
# tests/test_packaging.py now asserts that every module named by an entry point
# is actually included, so this cannot recur silently.
[tool.hatch.build.targets.wheel]
include = [
    "haldir_gate",
    "haldir_vault",
    "haldir_watch",
    "sdk",
    # A glob, not a list. The bug this replaced was a hand-written enumeration
    # that named three modules and silently missed `haldir_merkle` and
    # `haldir_migrate`, which `cli.py` also imports — the package installed
    # fine and could not start. `haldir_*.py` covers the modules now and the
    # ones added later; `cli.py` and `api.py` are named because they are the
    # two entry points that do not carry the prefix.
    "haldir_*.py",
    "cli.py",
    "api.py",
]

[tool.hatch.build.targets.sdist]
include = [
    "haldir_gate/**",
    "haldir_vault/**",
    "haldir_watch/**",
    "sdk/**",
    "haldir_mcp_server.py",
    "haldir_db.py",
    "cli.py",
    "README.md",
    "pyproject.toml",
]
