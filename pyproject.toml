[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "haldir"
version = "0.3.2"
description = "The guardian layer for AI agents — scoped sessions, AES-256-GCM secrets, hash-chained audit, policy proxy."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sterling Ivey", email = "sterling@haldir.xyz"}]
maintainers = [{name = "Sterling Ivey", email = "sterling@haldir.xyz"}]
keywords = [
    "ai-agents", "agent-governance", "agent-security",
    "mcp", "model-context-protocol",
    "langchain", "crewai", "vercel-ai-sdk",
    "identity", "secrets-management", "audit", "audit-log",
    "hash-chain", "tamper-evident", "compliance",
    "aes-256-gcm", "proxy", "policy-enforcement", "spend-control",
    "human-in-the-loop", "governance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Logging",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
    "Typing :: Typed",
]
# These must say the same thing as requirements.txt. They did not, and it cost
# the published package twice over:
#
#   * Five runtime dependencies were missing entirely. `api.py` is shipped and
#     imports flask at module level, so `pip install haldir && python -c
#     "import api"` failed on ModuleNotFoundError: No module named 'flask'.
#
#   * `mcp>=1.27.0` had no upper bound, so PyPI users resolved mcp 2.x, whose
#     Server API rewrite removed the `@server.list_tools()` decorator this code
#     uses — the MCP server died with `'Server' object has no attribute
#     'list_tools'`. CI never saw it because CI installs requirements.txt,
#     which correctly bounds mcp below 2.0.
#
# Every bound here is copied from requirements.txt, so a self-hoster and a
# `pip install` get the same thing. tests/test_packaging.py asserts the two
# lists describe the same packages.
dependencies = [
    "flask>=3.0.0,<4.0.0",
    "flask-cors>=4.0.0,<7.0.0",
    "gunicorn>=21.2.0,<27.0.0",
    "mcp>=1.27.0,<2.0.0",
    "httpx>=0.28.1,<1.0.0",
    "pydantic>=2.13.2,<3.0.0",
    "cryptography>=46.0.7,<51.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "stripe>=8.0.0,<16.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3", "pytest-asyncio>=1.3.0"]

[project.scripts]
haldir = "cli:main"
# haldir_mcp_server, not mcp_server. There were two stdio MCP servers: this
# one registers 18 tools (including the audit-integrity set — verify_chain,
# tree heads, inclusion and consistency proofs, evidence packs) and is the
# one with tests. mcp_server.py registered 9 of them, was untested, and was
# the one both this entry point and the Smithery listing actually launched —
# so every user got the narrower, unverified surface.
haldir-mcp = "haldir_mcp_server:main"

[project.urls]
Homepage = "https://haldir.xyz"
Documentation = "https://haldir.xyz/docs"
Repository = "https://github.com/ExposureGuard/haldir"
Issues = "https://github.com/ExposureGuard/haldir/issues"
Discussions = "https://github.com/ExposureGuard/haldir/discussions"
Changelog = "https://github.com/ExposureGuard/haldir/blob/main/CHANGELOG.md"
Wiki = "https://github.com/ExposureGuard/haldir/wiki"
"Self-Hosting" = "https://github.com/ExposureGuard/haldir/blob/main/SELF_HOSTING.md"
Security = "https://github.com/ExposureGuard/haldir/blob/main/SECURITY.md"

# `include` alone, naming the packages AND the loose top-level modules.
#
# This previously set `packages = [...]` and then an `include = [...]` for the
# three modules. Hatchling's `packages` is a shorthand that *replaces*
# `include`, so those three were dropped from the wheel — and with them the
# `haldir` console script, the `haldir-mcp` entry point, and the database
# layer both import.
#
# The published 0.3.0 on PyPI has this shape. It is not a rare edge: nobody who
# has ever run `pip install haldir` has been able to start the CLI, because the
# first line of the README dies on `ModuleNotFoundError: No module named 'cli'`.
# tests/test_packaging.py now asserts that every module named by an entry point
# is actually included, so this cannot recur silently.
[tool.hatch.build.targets.wheel]
# Every module, named explicitly.
#
# The glob "haldir_*.py" that preceded this built a correct 29-module wheel
# locally and a wheel missing haldir_logging.py and haldir_tracing.py in CI —
# the installed package then failed to import haldir_db, haldir_gate,
# haldir_vault and haldir_watch, because each imports one of them. Rather than
# work out which hatchling resolves globs differently, the list is now
# explicit. tests/test_packaging.py fails when it goes stale, which is the
# property that actually matters: a module added without being listed here
# breaks the build rather than the installed package.
include = [
    "haldir_admin.py",
    "haldir_audit_tree.py",
    "haldir_compliance.py",
    "haldir_compliance_scheduler.py",
    "haldir_compliance_score.py",
    "haldir_db.py",
    "haldir_demo_tamper.py",
    "haldir_email.py",
    "haldir_export.py",
    "haldir_health.py",
    "haldir_idempotency.py",
    "haldir_logging.py",
    "haldir_mcp_proxy.py",
    "haldir_mcp_server.py",
    "haldir_merkle.py",
    "haldir_metrics.py",
    "haldir_migrate.py",
    "haldir_openapi.py",
    "haldir_outbound.py",
    "haldir_rekor_verify.py",
    "haldir_retention.py",
    "haldir_scopes.py",
    "haldir_status.py",
    "haldir_sth_log.py",
    "haldir_tiers.py",
    "haldir_tracing.py",
    "haldir_top.py",
    "haldir_transparency_mirror.py",
    "haldir_validation.py",
    "haldir_x402.py",
    # The packages.
    "haldir_gate",
    "haldir_vault",
    "haldir_watch",
    "sdk",
    # The two entry-point modules that do not carry the prefix.
    "cli.py",
    "api.py",
    # ── Content the app serves from disk ──
    #
    # The HTTP routes read these with a bare open() relative to the package
    # directory, so they are part of the product, not documentation: without
    # them an installed copy answers 500 on /llms.txt, /.well-known/agent.json,
    # /AGENTS.md, /robots.txt, /sitemap.xml, the docs, the blog and the demo.
    # That is the same failure as 0.3.0 shipping four modules of twenty-seven —
    # files that exist in the checkout and nowhere a user gets them.
    #
    # It matters most for the discovery surface: those files are how an agent
    # or a registry works out that Haldir exists. An installed Haldir was
    # invisible to exactly the audience it is built for.
    "llms.txt",
    "llms-full.txt",
    "robots.txt",
    "sitemap.xml",
    "ai-plugin.json",
    "AGENTS.md",
    "THREAT_MODEL.md",
    "SECURITY.md",
    "HOW_IT_WORKS.md",
    "SELF_HOSTING.md",
    "CONTRIBUTING.md",
    "CHANGELOG.md",
    "dashboard.html",
    "demo_gallery.html",
    "quickstart.html",
    ".well-known",
    "landing",
    "blog",
    "demo",
    "docs",

]

[tool.hatch.build.targets.sdist]
# The same modules as the wheel, and this list is the load-bearing one.
#
# `python -m build` builds the sdist first and then builds the *wheel from the
# sdist*. So anything missing here is missing from the wheel too, no matter
# what the wheel target says — which is why two rounds of fixing the wheel's
# include list changed nothing: the wheel was being built out of an
# incomplete sdist, and the two files that kept going missing
# (haldir_logging.py, haldir_tracing.py) were exactly the ones this list
# lacked.
#
# It also matters on its own: an sdist that cannot build a complete wheel is
# broken for anyone installing from source rather than from a wheel.
include = [
    "haldir_admin.py",
    "haldir_audit_tree.py",
    "haldir_compliance.py",
    "haldir_compliance_scheduler.py",
    "haldir_compliance_score.py",
    "haldir_db.py",
    "haldir_demo_tamper.py",
    "haldir_email.py",
    "haldir_export.py",
    "haldir_health.py",
    "haldir_idempotency.py",
    "haldir_logging.py",
    "haldir_mcp_proxy.py",
    "haldir_mcp_server.py",
    "haldir_merkle.py",
    "haldir_metrics.py",
    "haldir_migrate.py",
    "haldir_openapi.py",
    "haldir_outbound.py",
    "haldir_rekor_verify.py",
    "haldir_retention.py",
    "haldir_scopes.py",
    "haldir_status.py",
    "haldir_sth_log.py",
    "haldir_tiers.py",
    "haldir_tracing.py",
    "haldir_top.py",
    "haldir_transparency_mirror.py",
    "haldir_validation.py",
    "haldir_x402.py",
    "haldir_gate/**",
    "haldir_vault/**",
    "haldir_watch/**",
    "sdk/**",
    "cli.py",
    "api.py",
    "README.md",
    "pyproject.toml",
    # ── Content the app serves from disk ──
    #
    # The HTTP routes read these with a bare open() relative to the package
    # directory, so they are part of the product, not documentation: without
    # them an installed copy answers 500 on /llms.txt, /.well-known/agent.json,
    # /AGENTS.md, /robots.txt, /sitemap.xml, the docs, the blog and the demo.
    # That is the same failure as 0.3.0 shipping four modules of twenty-seven —
    # files that exist in the checkout and nowhere a user gets them.
    #
    # It matters most for the discovery surface: those files are how an agent
    # or a registry works out that Haldir exists. An installed Haldir was
    # invisible to exactly the audience it is built for.
    "llms.txt",
    "llms-full.txt",
    "robots.txt",
    "sitemap.xml",
    "ai-plugin.json",
    "AGENTS.md",
    "THREAT_MODEL.md",
    "SECURITY.md",
    "HOW_IT_WORKS.md",
    "SELF_HOSTING.md",
    "CONTRIBUTING.md",
    "CHANGELOG.md",
    "dashboard.html",
    "demo_gallery.html",
    "quickstart.html",
    ".well-known",
    "landing",
    "blog",
    "demo",
    "docs",

]
